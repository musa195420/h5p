name: lumi_h5p
description: A Flutter plugin to view and serve H5P content locally using a static server and InAppWebView.
version: 1.0.0
homepage: https://muhammad-musa.netlify.app/
repository: https://github.com/musa195420/h5p.git
issue_tracker: https://github.com/musa195420/h5p/issues
license: MIT

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  webview_flutter: ^4.10.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  path_provider: ^2.1.5
  flutter_inappwebview: ^6.1.5
  dhttpd: ^4.1.0
  permission_handler: ^11.3.1
  dio: ^5.9.0
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
